<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Chi Hoang — Browse</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131011'/%3E%3Crect x='30' y='12' width='10' height='10' transform='rotate(45 35 17)' fill='%23FF4D8D'/%3E%3Ctext x='30' y='45' font-family='Georgia,serif' font-size='30' fill='%23F4EDEE'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#galleryMain">Skip to content</a>

    <!-- ===== TOP NAV ===== -->
    <header class="topnav" id="topnav">
        <a class="wordmark" href="index.html" aria-label="Chi Hoang — home">Chi<span class="dot">.</span></a>

        <nav class="topnav-links" aria-label="Collections">
            <a href="index.html">Featured</a>
            <a href="gallery.html?collection=fashion" data-nav="fashion">Fashion</a>
            <a href="gallery.html?collection=art" data-nav="art">Art &amp; Design</a>
            <a href="gallery.html?collection=writing" data-nav="writing">Writing</a>
            <a href="gallery.html?collection=data" data-nav="data">Data &amp; Decks</a>
        </nav>

        <a class="nav-profile" href="index.html#about" aria-label="About Chi Hoang">
            <img src="images/featured/bio.jpg" alt="Chi Hoang">
            <span>Chi</span>
        </a>

          <div class="nav-extra">
                      
               <a class="btn-pill hide-sm" href="https://cchihoangg.github.io/chi_resume.pdf" target="_blank" rel="noopener noreferrer">Résumé</a>        
          

        <button class="btn-pill hide-sm" id="randomBtn" type="button" title="Open a random project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            <a class="lbl">Surprise me</a>
        </button>
         <a class="icon-btn nav-icon" href="mailto:hoangmaichi0503@gmail.com" aria-label="Email">
                            <svg viewBox="0 0 24 24"><path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.107 10-8.107v11.817h-20z"/></svg>
                        </a>
              <a class="icon-btn nav-icon" href="https://www.linkedin.com/in/chi-hoang-b590ba246/" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.783-1.75-1.75s.784-1.75 1.75-1.75 1.75.783 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>
          </div>
    </header>

    <!-- ===== PAGE HEAD ===== -->
    <div class="page-head">
        <nav class="crumbs" aria-label="Breadcrumb">
            <a href="index.html">Home</a><span class="sep">◆</span><span id="crumbCurrent">Browse</span>
        </nav>
        <div class="page-head-grid">
            <h1 class="page-title" id="collectionTitle">Loading…</h1>
            <p class="page-desc" id="collectionDesc"></p>
        </div>
   
    </div>

    <main id="galleryMain">

        <!-- ===== WORK RAIL — browse the collection; nothing here duplicates the
             top nav's collection links, it's just the projects themselves ===== -->
        <section class="row" aria-label="Works in this collection">
            <div class="row-head">
                <h2 class="row-title"><span class="tick">◆</span>Browse</h2>
                <p class="row-sub" id="railCount"></p>
                <p class="row-hover-synopsis" id="hoverSynopsis" aria-live="polite"></p>
            </div>

            <div class="loading" id="loadingState">
                <div class="spinner"></div>
                Loading collection…
            </div>
            <div class="error" id="errorState" style="display:none">
                <p>Unable to load collection. Please try again later.</p>
            </div>

            <div class="rail-wrap" id="railWrap" style="display:none">
                <button class="rail-edge prev" id="railPrev" type="button" aria-label="Scroll left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="work-rail" id="workRail"></div>
                <button class="rail-edge next" id="railNext" type="button" aria-label="Scroll right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <button class="scroll-cue" id="scrollCue" type="button" style="display:none">
                <span id="scrollCueLabel">Read the story</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </section>

        <!-- ===== SELECTED WORK — the rail always has something chosen, so its
             write-up always shows here; picking another card just swaps this in ===== -->
        <section class="post-shell" id="detail" aria-label="Selected project" style="display:none">
            <header class="post-hero">
                <div class="post-hero-media" id="detailHeroMedia"></div>
                <div class="post-hero-fade"></div>
                <div class="post-hero-inner">
                    <p class="post-kicker" id="detailKicker">Now reading</p>
                    <h2 class="post-title" id="detailTitle"></h2>
                    <div class="post-meta" id="detailMeta"></div>
                </div>
            </header>
            <div class="post-body">
                <div class="post-main" id="detailMain"></div>
            </div>
            <div class="work-nav" id="workNav"></div>
        </section>

    </main>

    <!-- lightbox -->
    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
        <button class="lb-close" id="lbClose" aria-label="Close">×</button>
        <img src="" alt="" id="lbImg">
    </div>

    <script src="galleryscript.js" defer></script>
</body>
</html>
